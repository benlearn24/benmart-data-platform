project:
  name: benmart-data-platform
  environment: ${ENV}

s3:
  raw_bucket: benmart-dev-raw
  bronze_bucket: benmart-dev-bronze
  silver_bucket: benmart-dev-silver
  gold_bucket: benmart-dev-gold
  manifest_prefix: manifests/

silver:
  load_mode: incremental
  output_path: enriched_orders/

gold:
  load_mode: full
  silver_input_path: enriched_orders/

tables:
  orders:
    raw_path: orders/
    bronze_path: orders/
    load_mode: incremental
    source: pos_system
    source_format: csv
    primary_key: order_id
    partition_column: null
    schema_file: config/schemas/orders.json
    read_options:
      header: "true"
      delimiter: ","
      inferSchema: "false"

  customers:
    raw_path: customers/
    bronze_path: customers/
    load_mode: incremental
    source: api
    source_format: json
    primary_key: customer_id
    partition_column: null
    schema_file: config/schemas/customers.json
    read_options:
      multiLine: "true"

  products:
    raw_path: products/
    bronze_path: products/
    load_mode: full
    source: product_team
    source_format: parquet
    primary_key: product_id
    partition_column: null
    schema_file: config/schemas/products.json
